name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: statballer
          POSTGRES_USER: statballer
          POSTGRES_PASSWORD: statballer
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U statballer -d statballer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: ci-only-secret
      STATBALLER_DB_NAME: statballer
      STATBALLER_DB_USER: statballer
      STATBALLER_DB_PASSWORD: statballer
      STATBALLER_DB_HOST: 127.0.0.1
      STATBALLER_DB_PORT: 5432
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run Django checks
        working-directory: backend
        run: python manage.py check

      - name: Run backend tests
        working-directory: backend
        run: python manage.py test --noinput
